name: Security and test checks (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm download data
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node-22-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node-22-
      - name: Install production dependency tree safely
        run: npm install --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Run complete tests without dependency lifecycle scripts
        run: npm test
