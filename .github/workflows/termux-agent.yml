name: Termux Agent Tests
on:
  push:
    branches: [main]
    paths:
      - "termux-agent/**"
      - ".github/workflows/termux-agent.yml"
  pull_request:
    branches: [main]
    paths:
      - "termux-agent/**"
      - ".github/workflows/termux-agent.yml"
jobs:
  termux-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile termux-agent/ulugbek_termux_agent.py
      - name: Run safe local self-tests
        run: python termux-agent/ulugbek_termux_agent.py --self-test
