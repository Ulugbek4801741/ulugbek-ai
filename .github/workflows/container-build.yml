name: ULUGBEK AI container build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ops/free-tier-ha-foundation"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build production container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ulugbek-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
