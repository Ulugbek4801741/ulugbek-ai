name: ULUGBEK AI Extended Tests (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache npm download data
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node-22-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node-22-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check developer-agent.js
          node --check test/developer-agent.test.js
          node --check modules/catalog.js
          node --check modules/workflow-gate.js
          node --check test/workflow-gate.test.js
          node --check agent-runtime.js
          node --check agents/agent-contract.js
          node --check agents/registry.js
          node --check agents/memory-store.js
          node --check agents/chat-dispatcher.js
          node --check agents/chat-coordinator.js
          node --check agents/core-architect.js
          node --check agents/research-agent.js
          node --check agents/software-builder-agent.js
          node --check agents/frontend-agent.js
          node --check agents/backend-agent.js
          node --check agents/qa-agent.js
          node --check agents/security-agent.js
          node --check agents/devops-agent.js
          node --check agents/product-growth-agent.js
          node --check test/agent-registry.test.js
          node --check test/agent-memory-dispatcher.test.js
          node --check test/agent-runtime.test.js
          node --check public/config.js
          node --check public/app.js
          node --check public/admin.js
          node --check public/voice.js
          node --check public/lab.js
      - name: Run complete automated tests
        run: npm test
