name: ULUGBEK AI Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check agent-runtime.js
          node --check agents/agent-contract.js
          node --check agents/registry.js
          node --check agents/memory-store.js
          node --check agents/chat-dispatcher.js
          node --check agents/chat-coordinator.js
          node --check agents/core-architect.js
          node --check agents/research-agent.js
          node --check agents/software-builder-agent.js
          node --check agents/frontend-agent.js
          node --check agents/backend-agent.js
          node --check agents/qa-agent.js
          node --check agents/security-agent.js
          node --check agents/devops-agent.js
          node --check agents/product-growth-agent.js
          node --check test/agent-registry.test.js
          node --check test/agent-memory-dispatcher.test.js
          node --check test/agent-runtime.test.js
          node --check public/app.js
          node --check public/admin.js
          node --check public/voice.js
          node --check public/lab.js
      - name: Run API smoke tests
        run: npm test
      - name: Run specialist agent registry and memory tests
        run: node --test test/agent-registry.test.js test/agent-memory-dispatcher.test.js
