name: ULUGBEK AI Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check every JavaScript file syntax
        run: |
          find . -path './node_modules' -prune -o -path './.git' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Run API smoke tests
        run: npm test
      - name: Run specialist agent registry and memory tests
        run: node --test test/agent-registry.test.js test/agent-memory-dispatcher.test.js
