name: ULUGBEK AI Autonomous Maintenance

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: autonomous-maintenance-main
  cancel-in-progress: false

jobs:
  audit:
    name: Daily health, tests and public-source review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run complete test suite
        id: tests
        continue-on-error: true
        run: npm test

      - name: Check production dependency security
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Read approved public open-source references
        id: research
        continue-on-error: true
        run: node scripts/autonomous-maintenance.js

      - name: Check deployed Render health endpoint
        if: github.event_name != 'pull_request'
        id: live
        continue-on-error: true
        run: |
          mkdir -p reports
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 180 \
            --retry 8 --retry-delay 5 --retry-all-errors \
            https://ulugbek-ai2.onrender.com/api/health \
            --output reports/render-health.json
          node -e "JSON.parse(require('node:fs').readFileSync('reports/render-health.json','utf8')); console.log('Render health endpoint returned valid JSON')"

      - name: Upload audit and upstream research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulugbek-ai-autonomous-report
          path: |
            reports/autonomous-upstream-review.json
            reports/render-health.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce final quality result
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
          RESEARCH_RESULT: ${{ steps.research.outcome }}
          LIVE_RESULT: ${{ steps.live.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          printf 'Tests: %s\nSecurity audit: %s\nOpen-source review: %s\nRender health: %s\n' \
            "$TEST_RESULT" "$AUDIT_RESULT" "$RESEARCH_RESULT" "$LIVE_RESULT" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          for result in "$TEST_RESULT" "$AUDIT_RESULT" "$RESEARCH_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "At least one autonomous maintenance check failed."
              exit 1
            fi
          done
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$LIVE_RESULT" != "success" ]; then
            echo "Render health check failed."
            exit 1
          fi

      - name: Create or update maintenance issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "ULUGBEK AI autonomous maintenance detected a failure";
            const labels = ["autonomous-maintenance"];
            const body = [
              "The scheduled maintenance workflow detected a failure.",
              "",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              "",
              "Test result: ${{ steps.tests.outcome }}",
              "Security audit: ${{ steps.audit.outcome }}",
              "Open-source review: ${{ steps.research.outcome }}",
              "Render health: ${{ steps.live.outcome }}",
              "",
              "This automation is diagnostic-only. It does not change source code, merge branches, or deploy to production.",
              "Inspect the workflow artifact and logs, then prepare a tested repair in an isolated branch."
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: labels.join(","),
              per_page: 100
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels
              });
            }
