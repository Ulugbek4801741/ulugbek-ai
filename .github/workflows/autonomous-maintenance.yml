name: ULUGBEK AI Autonomous Maintenance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: autonomous-maintenance-main
  cancel-in-progress: false

jobs:
  audit:
    name: Daily health, tests and public-source review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run complete test suite
        id: tests
        continue-on-error: true
        run: npm test

      - name: Check production dependency security
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Read approved public open-source references
        id: research
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/autonomous-maintenance.js

      - name: Verify persistent public research memory branch
        id: memory
        run: |
          mkdir -p reports
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            https://raw.githubusercontent.com/Ulugbek4801741/ulugbek-ai/autonomous-research-memory/memory/latest.json \
            --output reports/persistent-research-memory.json
          node -e "const r=require('./reports/persistent-research-memory.json'); if(!r.generatedAt || !Array.isArray(r.repositories) || r.repositories.length < 5) process.exit(1); console.log('Persistent public research sources:', r.repositories.length)"

      - name: Check deployed Render health endpoint
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        id: live
        continue-on-error: true
        run: |
          mkdir -p reports
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 180 \
            --retry 8 --retry-delay 5 --retry-all-errors \
            https://ulugbek-ai2.onrender.com/api/health \
            --output reports/render-health.json
          node -e "JSON.parse(require('node:fs').readFileSync('reports/render-health.json','utf8')); console.log('Render health endpoint returned valid JSON')"

      - name: Test real chat topic alignment
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        id: chat
        continue-on-error: true
        run: |
          mkdir -p reports
          node -e "process.stdout.write(JSON.stringify({message:'Hindiston aholisi soni hozir qancha?',sessionId:'maintenance-smoke-ulugbek-2026',countryCode:'UZ'}))" > reports/chat-smoke-request.json
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 150 \
            -H "Content-Type: application/json" \
            --data-binary @reports/chat-smoke-request.json \
            https://ulugbek-ai2.onrender.com/api/chat \
            --output reports/chat-smoke.json
          node scripts/chat-smoke-check.js reports/chat-smoke.json

      - name: Verify GitHub research notes reached the local language corpus
        id: learning
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          mkdir -p reports
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              https://ulugbek-ai2.onrender.com/api/health \
              --output reports/learning-health.json; then
              if node -e "const h=require('./reports/learning-health.json'); const s=h.publicResearchWorker?.githubResearchMemory?.savedSources||0; const c=h.languageTraining?.corpusSources||0; const trained=h.languageTraining?.modelTrained===true; if(s>=5 && c>=5 && trained) process.exit(0); process.exit(1)"; then
                echo "GitHub research notes reached the local language-pattern corpus."
                exit 0
              fi
            fi
            sleep 15
          done
          echo "GitHub research notes did not reach the local language corpus within 10 minutes."
          exit 1

      - name: Upload audit and upstream research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulugbek-ai-autonomous-report
          path: |
            reports/autonomous-upstream-review.json
            reports/render-health.json
            reports/chat-smoke.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce final quality result
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
          RESEARCH_RESULT: ${{ steps.research.outcome }}
          MEMORY_RESULT: ${{ steps.memory.outcome }}
          LEARNING_RESULT: ${{ steps.learning.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          LIVE_RESULT: ${{ steps.live.outcome }}
          CHAT_RESULT: ${{ steps.chat.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          printf 'Tests: %s\nSecurity audit: %s\nOpen-source review: %s\nRender health: %s\nChat topic smoke: %s\n' \
            "$TEST_RESULT" "$AUDIT_RESULT" "$RESEARCH_RESULT" "$LIVE_RESULT" "$CHAT_RESULT" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          for result in "$TEST_RESULT" "$AUDIT_RESULT" "$RESEARCH_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "At least one autonomous maintenance check failed."
              exit 1
            fi
          done
          if [ "$EVENT_NAME" != "push" ] && [ "$EVENT_NAME" != "pull_request" ] && { [ "$LIVE_RESULT" != "success" ] || [ "$CHAT_RESULT" != "success" ]; }; then
            echo "A live Render API or chat topic check failed."
            exit 1
          fi

      - name: Persist public research snapshot on isolated memory branch
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp reports/autonomous-upstream-review.json /tmp/autonomous-upstream-review.json
          git fetch origin autonomous-research-memory || true
          if git show-ref --verify --quiet refs/remotes/origin/autonomous-research-memory; then
            git checkout -B autonomous-research-memory origin/autonomous-research-memory
          else
            git checkout --orphan autonomous-research-memory
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p memory/snapshots
          cp /tmp/autonomous-upstream-review.json memory/latest.json
          snapshot="memory/snapshots/$(date -u +%Y%m%dT%H%M%SZ).json"
          cp /tmp/autonomous-upstream-review.json "$snapshot"
          find memory/snapshots -type f -mtime +30 -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/latest.json memory/snapshots
          git commit -m "chore: refresh autonomous public research memory"
          git push origin HEAD:autonomous-research-memory
          # Restore the tested application checkout: later deployment verification
          # needs scripts/chat-smoke-check.js from the main commit.
          git checkout -B main "$GITHUB_SHA"

      - name: Trigger Render deploy after all checks pass
        id: deploy
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not configured; automatic Render deployment was skipped."
            echo "Render deployment skipped: add the Render deploy hook URL as repository secret RENDER_DEPLOY_HOOK_URL." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl --fail --silent --show-error --location --max-time 30 \
            --request POST "$RENDER_DEPLOY_HOOK_URL" \
            --output /tmp/render-deploy-hook-response.json
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "Render deploy hook accepted the tested main commit." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the new Render commit is live
        id: post_deploy_health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
        run: |
          mkdir -p reports
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              https://ulugbek-ai2.onrender.com/api/health \
              --output reports/post-deploy-health.json; then
              if node -e "const h=require('./reports/post-deploy-health.json'); if(h.ok!==true) process.exit(1); if(process.env.DEPLOYED==='true' && h.buildCommit!==process.env.EXPECTED_COMMIT) process.exit(1)"; then
                if [ "$DEPLOYED" = "true" ]; then
                  echo "The tested commit is live on Render: $EXPECTED_COMMIT"
                else
                  echo "Render health endpoint is live; deploy hook is not configured, so the current deployed commit was checked."
                fi
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Render did not report the expected commit within 15 minutes."
          exit 1

      - name: Re-test chat after Render deployment
        id: post_deploy_chat
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p reports
          node -e "process.stdout.write(JSON.stringify({message:'Hindiston aholisi soni hozir qancha?',sessionId:'postdeploy-smoke-' + process.env.GITHUB_RUN_ID,countryCode:'UZ'}))" > reports/post-deploy-chat-request.json
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 150 \
            -H "Content-Type: application/json" \
            --data-binary @reports/post-deploy-chat-request.json \
            https://ulugbek-ai2.onrender.com/api/chat \
            --output reports/post-deploy-chat.json
          node scripts/chat-smoke-check.js reports/post-deploy-chat.json

      - name: Upload post-deploy verification report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ulugbek-ai-post-deploy-report
          path: |
            reports/post-deploy-health.json
            reports/post-deploy-chat.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce deployment verification
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          POST_HEALTH_RESULT: ${{ steps.post_deploy_health.outcome }}
          POST_CHAT_RESULT: ${{ steps.post_deploy_chat.outcome }}
        run: |
          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "Render deployment trigger failed."
            exit 1
          fi
          if [ "$POST_HEALTH_RESULT" != "success" ] || [ "$POST_CHAT_RESULT" != "success" ]; then
            echo "Live Render health or chat verification failed."
            exit 1
          fi
          if [ "$DEPLOYED" = "true" ]; then
            echo "Render deploy and post-deploy verification passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Live Render health and chat were verified, but automatic deployment is waiting for the RENDER_DEPLOY_HOOK_URL secret." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create or update maintenance issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "ULUGBEK AI autonomous maintenance detected a failure";
            const labels = ["autonomous-maintenance"];
            const body = [
              "The scheduled maintenance workflow detected a failure.",
              "",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              "",
              "Test result: ${{ steps.tests.outcome }}",
              "Security audit: ${{ steps.audit.outcome }}",
              "Open-source review: ${{ steps.research.outcome }}",
              "Render health: ${{ steps.live.outcome }}",
              "Chat topic smoke: ${{ steps.chat.outcome }}",
              "Render deploy: ${{ steps.deploy.outcome }}",
              "Post-deploy health: ${{ steps.post_deploy_health.outcome }}",
              "Post-deploy chat: ${{ steps.post_deploy_chat.outcome }}",
              "",
              "This automation is diagnostic-only. It does not change source code, merge branches, or deploy to production.",
              "Inspect the workflow artifact and logs, then prepare a tested repair in an isolated branch."
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: labels.join(","),
              per_page: 100
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels
              });
            }
