services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  ollama-model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen2.5:3b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  ulugbek-ai:
    build: .
    restart: unless-stopped
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_TIMEOUT_MS: "60000"
      LEARNING_INTERVAL_MS: "300000"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - ulugbek_data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:size=64m

volumes:
  ollama_models:
  ulugbek_data:
